<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelola Link Afiliasi</title>
<style>
  :root {
    --orange: #ff5b00;
    --orange-dark: #e64e00;
    --orange-light: #fff1e8;
    --bg: #f7f5f2;
    --card: #ffffff;
    --border: #ececec;
    --text: #1c1c1c;
    --muted: #8a8a8a;
    --danger: #e5484d;
    --success: #1a9c5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .header {
    background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
    color: white;
    padding: 32px 20px 64px;
    text-align: center;
  }
  .header h1 {
    margin: 0 0 8px;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .header p {
    margin: 0;
    font-size: 14px;
    opacity: 0.92;
    max-width: 380px;
    margin: 0 auto;
    line-height: 1.5;
  }
  .wrap {
    max-width: 640px;
    margin: -40px auto 60px;
    padding: 0 16px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
  }
  .card h2 {
    font-size: 19px;
    margin: 0 0 18px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin: 16px 0 6px;
  }
  label .req { color: var(--orange); }
  .input-icon {
    position: relative;
  }
  .input-icon svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #b8b8b8;
  }
  .input-icon input {
    padding-left: 40px;
  }
  input[type="text"], input:not([type]), input[type="url"], textarea {
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus {
    border-color: var(--orange);
  }
  textarea { resize: vertical; min-height: 64px; font-family: inherit; }

  .file-row {
    display: flex;
    align-items: center;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .file-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--orange-light);
    color: var(--orange);
    font-weight: 600;
    font-size: 13.5px;
    padding: 13px 16px;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .file-row input[type="file"] { display: none; }
  .file-name {
    padding: 0 14px;
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upload-status { font-size: 12px; margin-top: 6px; }
  .upload-status.ok { color: var(--success); }
  .upload-status.err { color: var(--danger); }
  .photo-preview {
    margin-top: 10px;
    width: 100%;
    max-height: 150px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: none;
  }
  .or-url { margin-top: 8px; }

  .btn-generate {
    width: 100%;
    margin-top: 22px;
    background: var(--orange);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-generate:hover { background: var(--orange-dark); }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; }

  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .list-header h2 { margin: 0; }
  .search-box {
    position: relative;
    flex: 1;
    min-width: 160px;
    max-width: 220px;
  }
  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #b8b8b8;
  }
  .search-box input {
    padding: 9px 12px 9px 36px;
    border-radius: 10px;
    font-size: 13px;
  }

  .empty {
    text-align: center;
    padding: 30px 10px 10px;
  }
  .empty .icon-wrap {
    width: 84px;
    height: 84px;
    margin: 0 auto 16px;
    background: var(--orange-light);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .empty strong { display: block; font-size: 15px; margin-bottom: 4px; }
  .empty p { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }
  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: white;
    color: var(--orange);
    border: 1.5px solid var(--orange);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .link-item {
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
  }
  .link-item img {
    width: 60px; height: 60px; object-fit: cover; border-radius: 10px; background: var(--bg); flex-shrink: 0;
  }
  .link-item .body { flex: 1; min-width: 0; }
  .link-item .title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  .link-item .short { color: var(--orange); font-size: 13px; word-break: break-all; }
  .link-item .target { color: var(--muted); font-size: 12px; word-break: break-all; margin-top: 2px; }
  .link-item .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .link-item .actions { display: flex; gap: 8px; margin-top: 10px; }
  .link-item .actions button {
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-copy { background: var(--orange-light); color: var(--orange); }
  .btn-del { background: #fdeeee; color: var(--danger); }
</style>
</head>
<body>

<div class="header">
  <h1>Kelola Link Afiliasi</h1>
  <p>Buat link pendek dengan preview foto khusus untuk dibagikan di Facebook.</p>
</div>

<div class="wrap">
  <div class="card">
    <h2>Buat Link Baru</h2>

    <label>URL Afiliasi Tujuan <span class="req">*</span></label>
    <input id="target" placeholder="https://tokopedia.link/xxxxx" />

    <label>Foto Preview <span style="font-weight:400;color:var(--muted);">(pilih 2-6 foto untuk dibuat kolase otomatis)</span></label>
    <div class="file-row">
      <label class="file-btn" for="photoFile">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        Pilih File
      </label>
      <span class="file-name" id="fileName">Tidak ada file yang dipilih</span>
      <input type="file" id="photoFile" accept="image/jpeg,image/png,image/webp,image/gif" multiple onchange="handlePhotoSelection()" />
    </div>
    <div id="uploadStatus" class="upload-status"></div>
    <img id="photoPreview" class="photo-preview" />

    <input id="image" class="or-url" placeholder="https://contoh.com/foto-produk.jpg (atau upload di atas)" />

    <label>Judul Preview</label>
    <input id="title" placeholder="Diskon 50% Sepatu Lari Terbaru!" />

    <label>Deskripsi Preview</label>
    <textarea id="description" placeholder="Cek promo spesial hari ini, stok terbatas!"></textarea>

    <label>Kode Custom (opsional)</label>
    <input id="customCode" placeholder="promo-sepatu (kosongkan untuk otomatis)" />

    <button class="btn-generate" onclick="createLink()">
      Generate Link
    </button>
    <div class="error" id="error"></div>
  </div>

  <div class="card">
    <div class="list-header">
      <h2>Daftar Link</h2>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="Cari link..." oninput="loadLinks()" />
      </div>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
let allLinks = [];

async function loadLinks() {
  const res = await fetch('/api/links');
  allLinks = await res.json();
  renderList();
}

function renderList() {
  const list = document.getElementById('list');
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();

  const filtered = q
    ? allLinks.filter(l =>
        (l.title || '').toLowerCase().includes(q) ||
        (l.code || '').toLowerCase().includes(q) ||
        (l.target || '').toLowerCase().includes(q))
    : allLinks;

  if (allLinks.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="icon-wrap">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ff5b00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
        </div>
        <strong>Belum ada link.</strong>
        <p>Buat yang pertama di atas!</p>
        <button class="btn-outline" onclick="document.getElementById('target').focus()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Buat Link Sekarang
        </button>
      </div>`;
    return;
  }

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><p>Tidak ada link yang cocok dengan pencarian.</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(l => `
    <div class="link-item">
      ${l.image ? `<img src="${escapeHtml(l.image)}" onerror="this.style.display='none'" />` : ''}
      <div class="body">
        <div class="title">${escapeHtml(l.title)}</div>
        <div class="short">${escapeHtml(l.shortUrl)}</div>
        <div class="target">→ ${escapeHtml(l.target)}</div>
        <div class="meta">${l.clicks} klik · dibuat ${new Date(l.createdAt).toLocaleDateString('id-ID')}</div>
        <div class="actions">
          <button class="btn-copy" onclick="copyLink('${l.shortUrl}')">Salin</button>
          <button class="btn-del" onclick="deleteLink('${l.code}')">Hapus</button>
        </div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function handlePhotoSelection() {
  const fileInput = document.getElementById('photoFile');
  const status = document.getElementById('uploadStatus');
  const preview = document.getElementById('photoPreview');
  const imageField = document.getElementById('image');
  const fileName = document.getElementById('fileName');

  const files = fileInput.files;
  if (!files || files.length === 0) return;

  fileName.textContent = files.length === 1
    ? files[0].name
    : `${files.length} foto dipilih (akan dibuat kolase)`;

  status.textContent = files.length === 1 ? 'Mengupload...' : 'Membuat kolase...';
  status.className = 'upload-status';

  const formData = new FormData();
  const endpoint = files.length === 1 ? '/api/upload' : '/api/collage';

  if (files.length === 1) {
    formData.append('photo', files[0]);
  } else {
    for (const f of files) formData.append('photos', f);
  }

  try {
    const res = await fetch(endpoint, { method: 'POST', body: formData });
    const data = await res.json();

    if (!res.ok) {
      status.textContent = data.error || 'Upload gagal';
      status.className = 'upload-status err';
      return;
    }

    imageField.value = data.imageUrl;
    preview.src = data.imageUrl;
    preview.style.display = 'block';
    status.textContent = files.length === 1
      ? 'Foto berhasil diupload ✓'
      : `Kolase dari ${data.photosUsed} foto berhasil dibuat ✓`;
    status.className = 'upload-status ok';
  } catch (e) {
    status.textContent = 'Terjadi kesalahan saat upload';
    status.className = 'upload-status err';
  }
}

async function createLink() {
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';

  const payload = {
    target: document.getElementById('target').value.trim(),
    title: document.getElementById('title').value.trim(),
    description: document.getElementById('description').value.trim(),
    image: document.getElementById('image').value.trim(),
    customCode: document.getElementById('customCode').value.trim(),
  };

  const res = await fetch('/api/links', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });

  const data = await res.json();

  if (!res.ok) {
    errorEl.textContent = data.error || 'Terjadi kesalahan';
    return;
  }

  document.getElementById('target').value = '';
  document.getElementById('title').value = '';
  document.getElementById('description').value = '';
  document.getElementById('image').value = '';
  document.getElementById('customCode').value = '';
  document.getElementById('fileName').textContent = 'Tidak ada file yang dipilih';
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('uploadStatus').textContent = '';

  loadLinks();
}

async function deleteLink(code) {
  if (!confirm('Hapus link ini?')) return;
  await fetch('/api/links/' + code, { method: 'DELETE' });
  loadLinks();
}

function copyLink(url) {
  navigator.clipboard.writeText(url);
  alert('Link disalin: ' + url);
}

loadLinks();
</script>
</body>
</html>
